services:
  postgres:
    image: postgres:16-alpine
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  model-runtime:
    build: ./model/runtime
    ports:
      - "8010:8010"
    environment:
      MODEL_RUNTIME_MODEL_DIR: /data/model-images/qwen/Qwen3.5-4B
      MODEL_RUNTIME_ADAPTER_DIR: /data/model-assets/qwen3.5-4b/local-4060-oct-focus-cont-20261025-01/best_adapter
      MODEL_RUNTIME_IMAGE_ROOT: /data/model-images
      MODEL_RUNTIME_UPLOAD_ROOT: /data/uploads
      MODEL_RUNTIME_INTERNAL_TOKEN: ${APP_INTERNAL_SERVICE_TOKEN:-}
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8010/health', timeout=3)"
      interval: 5s
      timeout: 4s
      retries: 12
    volumes:
      - ./model/training/models:/data/model-images:ro
      - ./model/training/assets:/data/model-assets:ro
      - case-uploads:/data/uploads:ro

  backend:
    build: ./backend
    ports:
      - "8000:8000"
    environment:
      APP_ENVIRONMENT: development
      APP_DATABASE_URL: postgresql+psycopg://postgres:postgres@postgres:5432/postgres
      APP_REDIS_URL: redis://redis:6379/0
      APP_DATA_DIR: /data
      APP_INTERNAL_SERVICE_TOKEN: ${APP_INTERNAL_SERVICE_TOKEN:-}
      APP_PERCEPTION_SERVICE_URL: http://model-runtime:8010
      APP_RETRIEVAL_SERVICE_URL: http://embedding-service:8011
      APP_VECTOR_PROVIDER: remote
      APP_BOOTSTRAP_ADMIN_PASSWORD: ${APP_BOOTSTRAP_ADMIN_PASSWORD:-}
    volumes:
      - case-uploads:/data/uploads
    depends_on:
      postgres:
        condition: service_healthy
      embedding-service:
        condition: service_healthy

  embedding-service:
    build: ./model/embedding
    ports:
      - "8011:8011"
    environment:
      EMBEDDING_MODEL_PATH: /data/models/bge-m3
      EMBEDDING_INTERNAL_TOKEN: ${APP_INTERNAL_SERVICE_TOKEN:-}
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8011/health', timeout=3)"
      interval: 5s
      timeout: 4s
      retries: 12
    volumes:
      - ./model/embedding/models:/data/models:ro

  analysis-worker:
    build: ./backend
    command: ["uv", "run", "python", "-m", "app.worker"]
    environment:
      APP_ENVIRONMENT: development
      APP_DATABASE_URL: postgresql+psycopg://postgres:postgres@postgres:5432/postgres
      APP_REDIS_URL: redis://redis:6379/0
      APP_DATA_DIR: /data
      APP_INTERNAL_SERVICE_TOKEN: ${APP_INTERNAL_SERVICE_TOKEN:-}
      APP_PERCEPTION_SERVICE_URL: http://model-runtime:8010
      APP_RETRIEVAL_SERVICE_URL: http://embedding-service:8011
      APP_VECTOR_PROVIDER: remote
      APP_BOOTSTRAP_ADMIN_PASSWORD: ${APP_BOOTSTRAP_ADMIN_PASSWORD:-}
    volumes:
      - case-uploads:/data/uploads
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      model-runtime:
        condition: service_healthy
      embedding-service:
        condition: service_healthy

  frontend:
    build: ./frontend
    ports:
      - "5173:5173"
    depends_on:
      - backend
    environment:
      VITE_API_BASE_URL: http://127.0.0.1:8000

volumes:
  case-uploads:
