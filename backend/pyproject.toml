[project]
name = "uveitis-backend"
version = "0.1.0"
description = "Uveitis auxiliary diagnosis backend service"
requires-python = ">=3.11,<3.13"
dependencies = [
  "fastapi==0.115.12",
  "uvicorn[standard]==0.34.2",
  "pydantic==2.10.6",
  "pydantic-settings==2.8.1",
  "httpx==0.28.1",
  "python-multipart==0.0.20",
  "zvec==0.8.0",
  "torch==2.8.0+cpu",
  "torchvision==0.23.0+cpu",
  "modelscope==1.33.0",
  "FlagEmbedding==1.3.5",
  "transformers==4.51.3",
  "tokenizers==0.21.2",
  "datasets==3.6.0",
  "huggingface-hub==0.30.2",
  "sqlalchemy==2.0.44",
  "psycopg[binary]==3.2.10",
  "redis==6.4.0",
  "pwdlib[argon2]==0.3.0",
]

[dependency-groups]
dev = [
  "pytest==8.3.5",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
torchvision = { index = "pytorch-cpu" }
