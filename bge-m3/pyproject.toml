[project]
name = "uveitis-model-embedding"
version = "0.1.0"
description = "BGE-M3 embedding FastAPI service for the uveitis research prototype"
requires-python = ">=3.11,<3.13"
dependencies = [
  "fastapi==0.115.12",
  "uvicorn[standard]==0.34.2",
  "pydantic==2.10.6",
]

[dependency-groups]
dev = [
  "pytest==8.3.5",
  "httpx==0.28.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
